[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "profileshape"
version = "3.1.0"
description = "Replicate-aware detection of differential signal-profile shapes at predefined genomic regions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ProfileShape contributors" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6"]

[project.optional-dependencies]
bigwig = ["pyBigWig>=0.3.25"]
bam = ["pysam>=0.22"]
all = ["pyBigWig>=0.3.25", "pysam>=0.22"]
benchmarks = ["pyBigWig>=0.3.25", "pysam>=0.22", "markdown>=3.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
profileshape = "profileshape.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/profileshape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
